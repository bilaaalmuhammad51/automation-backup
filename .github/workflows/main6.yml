name: daily 66

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  execute-ui-tests:
    name: Run UI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Run UI Tests (Playwright + Allure)
        env:
          MARKETSCALE_STAGING_URL: ${{ secrets.MARKETSCALE_STAGING_URL }}
        run: |
          npx playwright install --with-deps
          npx playwright test --reporter=line,allure-playwright

      - name: Upload UI Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: allure-results
          retention-days: 7

  generate-allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [execute-ui-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-allure-results
          path: merged-allure-results

      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline --no-save
          allure generate merged-allure-results --clean -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

  publish-allure-report:
    name: Publish Allure to GitHub Pages
    runs-on: ubuntu-latest
    needs: generate-allure-report

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./current-report

      - name: Create deploy structure
        run: |
          mkdir -p deploy/latest
          cp -r current-report/* deploy/latest/

      - name: Create redirect index.html
        run: |
          echo '<meta http-equiv="refresh" content="0; url=./latest/">' > deploy/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true

  send-teams-summary:
    name: Send Test Summary to Teams
    runs-on: ubuntu-latest
    needs: [generate-allure-report]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-allure-results
          path: allure-results

      - name: Extract Test Summary
        id: summary
        run: |
          passed=$(grep -r "\"status\": \"passed\"" -o allure-results | wc -l)
          failed=$(grep -r "\"status\": \"failed\"" -o allure-results | wc -l)
          skipped=$(grep -r "\"status\": \"skipped\"" -o allure-results | wc -l)
          total=$((passed + failed + skipped))

          echo "passed=$passed" >> $GITHUB_OUTPUT
          echo "failed=$failed" >> $GITHUB_OUTPUT
          echo "skipped=$skipped" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT

      - name: Send message to Teams
        run: |
          json="{\"message\": \"UI Test Run #${{ github.run_number }} Completed\nTotal: ${{ steps.summary.outputs.total }}\nPassed: ${{ steps.summary.outputs.passed }}\nFailed: ${{ steps.summary.outputs.failed }}\nSkipped: ${{ steps.summary.outputs.skipped }}\n\nAllure Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest/\"}"
          curl -X POST \
          -H "Content-Type: application/json" \
          -d "$json" \
          ${{ secrets.TEAMS_WEBHOOK_URL }}
